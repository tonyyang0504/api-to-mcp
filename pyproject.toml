[project]
name = "api-to-mcp"
version = "0.1.0"
description = "Turn API documentation (a docs URL, OpenAPI/Swagger, Postman, RAML, WSDL, GraphQL, an HTML page or pasted text) into an MCP server: an evidence-only entry, tested and live-verified, served by platform-mcp-hub. MCP server, CLI and Claude Code plugin."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "api-to-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "openapi", "swagger", "api", "code-generation", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Code Generators",
]
# platform-mcp-hub: the runtime, vocabularies, lint and verification the entries run on. The rest lets the gates run
# from this package's own environment: Swagger/OpenAPI YAML (pyyaml), the contract tests (pytest, pytest-asyncio,
# respx) and live verification's schema checks (jsonschema).
dependencies = [
  "platform-mcp-hub>=0.1,<0.2",
  "mcp>=2.2,<3",
  "httpx>=0.27",
  "pyyaml>=6",
  "jsonschema>=4",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "build"]

[project.scripts]
api-to-mcp = "api_to_mcp.cli:entry"

[project.urls]
Homepage = "https://github.com/tonyyang0504/api-to-mcp"
Source = "https://github.com/tonyyang0504/api-to-mcp"
Issues = "https://github.com/tonyyang0504/api-to-mcp/issues"
Changelog = "https://github.com/tonyyang0504/api-to-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_to_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src/api_to_mcp", "/README.md", "/LICENSE", "/NOTICE"]
exclude = ["**/__pycache__"]

# Until platform-mcp-hub is on PyPI, uv (the Claude Code plugin, `uv run`) takes it from the platform-mcp repository.
# Remove this block once platform-mcp-hub 0.1.0 is published (RELEASE_CHECKLIST.md); pip ignores it.
[tool.uv.sources]
platform-mcp-hub = { git = "https://github.com/tonyyang0504/platform-mcp", branch = "main" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py310"
extend-exclude = ["_platform-mcp"]  # CI checks the runtime repository out here

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "E731", "B904"]
